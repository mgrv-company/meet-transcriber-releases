# 수동 실행 전용(버전 입력): Mac(Apple Silicon, metal)과 Windows(x64, vulkan)를 동시에 빌드하고,
# 둘 다 경로 검사를 통과할 때만 릴리스 sidecar-v<버전>에 파일과 해시를 올린다. 공개 저장소라 Actions 분은 무료다.
# 불변식: 결과 파일 안에 만든 사람·서버·비공개 저장소의 이름이나 경로가 한 건도 없다(tools/check-paths.mjs).
# 릴리스는 미리 만들어 둔 것만 쓴다. 이 워크플로는 태그를 만들지 않는다.
name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 올릴 릴리스 버전(예 0.1.0 → 릴리스 sidecar-v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  tools-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: node --test tools/*.test.mjs

  mac:
    needs: tools-test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 시작 시각
        run: date -u +"start %Y-%m-%dT%H:%M:%SZ"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: mac-${{ hashFiles('Cargo.lock') }}
          restore-keys: mac-
      - name: 빌드(경로를 가짜 경로로 바꾼다)
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          src="$GITHUB_WORKSPACE"
          export RUSTFLAGS="--remap-path-prefix=$HOME=/home --remap-path-prefix=$src=/build --remap-path-prefix=$rustup_home=/rustup --remap-path-prefix=$cargo_home=/cargo"
          prefix_map="-ffile-prefix-map=$HOME=/home -ffile-prefix-map=$src=/build -ffile-prefix-map=$cargo_home=/cargo"
          export CFLAGS="$prefix_map" CXXFLAGS="$prefix_map"
          date -u +"build start %Y-%m-%dT%H:%M:%SZ"
          cargo build --release --locked --features metal
          date -u +"build end %Y-%m-%dT%H:%M:%SZ"
      - name: 결과 파일 검사와 해시
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp target/release/meet-transcriber "$RUNNER_TEMP/out/meet-transcriber-darwin-arm64"
          node tools/check-paths.mjs "$RUNNER_TEMP/out/meet-transcriber-darwin-arm64" --term "$USER"
          node tools/write-sha256.mjs "$RUNNER_TEMP/out/meet-transcriber-darwin-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meet-transcriber-darwin-arm64
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3
      - name: 끝난 시각
        if: always()
        run: date -u +"end %Y-%m-%dT%H:%M:%SZ"

  windows:
    needs: tools-test
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 시작 시각
        run: date -u +"start %Y-%m-%dT%H:%M:%SZ"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-
      - name: Vulkan SDK 설치
        timeout-minutes: 15
        shell: pwsh
        run: |
          choco install vulkan-sdk --version 1.4.350 -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK | Sort-Object Name | Select-Object -Last 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 빌드(경로를 가짜 경로로 바꾼다)
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
          CC: clang-cl
          CXX: clang-cl
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          if "%CARGO_HOME%"=="" set "CARGO_HOME=%USERPROFILE%\.cargo"
          if "%RUSTUP_HOME%"=="" set "RUSTUP_HOME=%USERPROFILE%\.rustup"
          set "RUSTFLAGS=--remap-path-prefix=%USERPROFILE%=/home --remap-path-prefix=%GITHUB_WORKSPACE%=/build --remap-path-prefix=%RUSTUP_HOME%=/rustup --remap-path-prefix=%CARGO_HOME%=/cargo -C link-arg=/PDBALTPATH:%%_PDB%%"
          set "PREFIX_MAP=-ffile-prefix-map=%USERPROFILE%=/home -ffile-prefix-map=%GITHUB_WORKSPACE%=/build -ffile-prefix-map=%CARGO_HOME%=/cargo"
          set "CFLAGS=%PREFIX_MAP%"
          set "CXXFLAGS=%PREFIX_MAP% /EHsc /GR"
          echo build start %DATE% %TIME%
          cargo build --release --locked --features vulkan || exit /b 1
          echo build end %DATE% %TIME%
      - name: 결과 파일 검사와 해시
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp target/release/meet-transcriber.exe "$out/meet-transcriber-windows-x64.exe"
          node tools/check-paths.mjs "$out/meet-transcriber-windows-x64.exe" --term "$USERNAME"
          node tools/write-sha256.mjs "$out/meet-transcriber-windows-x64.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meet-transcriber-windows-x64
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3
      - name: 끝난 시각
        if: always()
        run: date -u +"end %Y-%m-%dT%H:%M:%SZ"

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in *[!0-9.]*|"") echo "버전은 숫자와 점만 쓴다: $VERSION" >&2; exit 1;; esac
          tag="sidecar-v$VERSION"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          ls -l out
          gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "Mac(Apple Silicon, Metal)와 Windows(x64, Vulkan) 빌드. 워크플로 실행 ${GITHUB_RUN_ID}에서 만들었다."
            echo
            echo "SHA-256"
            cat out/meet-transcriber-darwin-arm64.sha256 out/meet-transcriber-windows-x64.exe.sha256
          } > notes.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.txt
